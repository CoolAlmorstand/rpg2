<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script type="module" defer src="/src/page-scripts/index/index.ts"> </script>
  <link rel="stylesheet" href="/src/app.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Micro+5&display=swap" rel="stylesheet">  
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">  
  <title>Menu</title>
  <style>
    html, body { 
      image-rendering: pixelated; 
      padding:0 ;
      margin: 0;
    }
    .book-panel {
      border-image-source: url("/ui-sprites/UI_TravelBook_BookCover01a.png");
      border-image-slice: 12 12 12 12 fill;
      border-image-width: 12px;
      border-image-repeat: stretch;
      border-width: 12px;
      border-style: solid;
    }
    .book-page-left {
      background-image: url("/ui-sprites/UI_TravelBook_BookPageLeft01a.png");
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }
    .book-page-right {
      background-image: url("/ui-sprites/UI_TravelBook_BookPageRight01a.png");
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }
    dialog {
      width: 100dvw;
      height: 100dvh;
      max-width: 100dvw;
      max-height: 100dvh;
      background-color: transparent;
      padding: 0;
      border: none;
    }

    dialog::backdrop {
      background-color: rgba(0, 0, 0, 0.5);
    }

    dialog:not([open]) {
      display: none;
    }
  </style>
</head>
<body class="w-full h-full pt-2 gap-2 bg-[#fdf8d4] overflow-hidden flex flex-col justify-start items-center">

  <p class="font-['Micro_5'] text-[42px] text-[#9B7653]">TEREBITHIA</p>

  <div class="book-panel w-[90%] h-[200px] flex flex-row">

    <div class="h-full book-page-left flex flex-col justify-center items-center gap-1 pb-3 w-1/2">
      <button id="play-button" class="font-['Micro_5'] text-[28px] w-1/2 flex flex-row justify-center items-center gap-1 bg-transparent border-none">
        Play
        <img class="w-2 h-2" src="/ui-sprites/UI_TravelBook_IconArrow01a.png"/>
      </button>
      <button class="font-['Micro_5'] text-[28px] w-1/2 flex flex-row justify-center items-center gap-1 bg-transparent border-none">
        Settings
        <img class="w-2 h-2" src="/ui-sprites/UI_TravelBook_IconGear01a.png"/>
      </button>
      <button id="multiplayer-button" class="font-['Micro_5'] text-[28px] w-1/2 flex flex-row justify-center items-center gap-1 bg-transparent border-none">
        Multiplayer
        <img class="w-2 h-2" src="/ui-sprites/UI_TravelBook_IconRestart01a.png"/>
      </button>
    </div>

    <div class="book-page-right flex flex-col justify-center items-center gap-1 box-border pb-2 px-2 pl-4 w-1/2 h-full">
      <p class="font-['Micro_5'] text-[22px] leading-none">Welcome to the best game ever made by the best most talendted dumfuck youve ever met</p>
    </div>

  </div>

  <dialog id="multiplayer-dialog" class="flex flex-row items-center justify-center">
      <div class="flex flex-col gap-5 items-center box-border p-3 bg-[#fdf8d4] rounded-xl w-8/10 "> 
        <p class="text-[#9B7653] text-3xl font-bold font-['Pixelify_Sans']"> Multiplayer </p>

        <div class="w-full h-px bg-[#9B7653]"></div>

        <div class="flex flex-col gap-5 items-center">
          <button id="create-game-button" class="w-40 bg-[#9B7653] text-white py-2 px-3 rounded-md font-['Pixelify_Sans'] font-medium "> Create Game </button>

          <div class="w-full h-px bg-[#9B7653]"></div>
          <input id="room-code-input-field" placeholder="Enter Room Code" class="w-39 text-center outline-none px-2 py-2 text-[#9B7653] border-[#9B7653] border-1 font-['Pixelify_Sans'] rounded-md" type="text" />
          <button id="join-game-button" class="w-40 border-1 border-[#9B7653] text-[#9B7653] py-2 px-3 rounded-md font-['Pixelify_Sans'] font-medium "> Join Game </button>
        </div>  
      </div> 
  </dialog>

  <dialog id="create-game-dialog" class="flex flex-row items-center justify-center">
      <div class="flex flex-col gap-5 items-center box-border p-3 bg-[#fdf8d4] rounded-xl w-8/10 "> 
        <p class="text-[#9B7653] text-3xl font-bold font-['Pixelify_Sans']"> Create Game </p>

        <div class="w-full h-px bg-[#9B7653]"></div>

        <div class="flex flex-col gap-5 w-full items-center justify-start">
          <div class="w-full flex flex-col gap-3">
            <button id="is-public-toggle" class="flex flex-row gap-2 items-center"> 
              <img id="is-public-toggle-icon" class="w-[25px] h-[15px]" src="/ui-sprites/UI_TravelBook_ButtonValue01a.png" /> 
              <p id="is-public-toggle-text" class="text-2xl font-['Micro_5'] text-black"> PRIVATE </p>
            </button> 
          </div>

          <button id="select-map-button" class="w-40 bg-[#9B7653] text-white py-2 px-3 rounded-md font-['Pixelify_Sans'] font-medium "> Select Map </button>
          <button id="create-room-button" class="w-40 bg-[#9B7653] text-white py-2 px-3 rounded-md font-['Pixelify_Sans'] font-medium "> Create Room </button>

        </div>  
      </div> 
  </dialog>

  <dialog id="select-map-dialog" class="flex flex-row items-center justify-center">
      <div class="flex flex-col gap-5 items-center box-border p-3 bg-[#fdf8d4] rounded-xl w-8/10 "> 
        <p class="text-[#9B7653] text-3xl font-bold font-['Pixelify_Sans']"> Select Map </p>

        <div class="w-full h-px bg-[#9B7653]"></div>

        <div id="map-list" class="overflow-y-auto max-h-120 flex flex-col gap-4 w-full items-center justify-start">
          
        </div>  
      </div> 
  </dialog>

  <template id="map-card-template">
    <div class="flex-shrink-0 w-full max-w-sm mx-auto bg-zinc-900 rounded-2xl overflow-hidden shadow-lg">
      
      <img class="w-full h-40 object-cover" data-bind="image" />

      <div class="p-4 flex flex-col gap-2">
        <h2 class="text-lg font-semibold text-white" data-bind="title"></h2>
        <p class="text-sm text-zinc-400" data-bind="description"></p>

        <button class="mt-3 w-full py-2 rounded-xl bg-blue-600 text-white active:scale-95 transition"
                data-action="select">
          Select
        </button>
      </div>

    </div>
  </template>
</body>
</html>
